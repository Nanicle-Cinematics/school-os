name: Migrate production

# Deliberately manual, and deliberately not part of the push-to-main pipeline.
#
# Vercel deploys main the moment it is pushed. If migrations ran in that same
# flow they would race the deployment, and a schema change would sometimes land
# after the code that needs it — which is an outage on every page touching the
# new column. So the order is: run this, watch it succeed, THEN merge.
#
# That is the same discipline that was already being followed by hand, minus the
# hand: the SQL is generated by Prisma, reviewed in the pull request and applied
# from the repository, instead of being written into a browser tab with two
# projects open. Hand-written SQL is how a Plan enum migration nearly shipped
# with a cast that errors on every existing row, and how the same file got run
# against the dev project twice while production stayed untouched.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do against production
        required: true
        default: status
        type: choice
        options:
          # Report what production has applied and what is pending. Safe, and the
          # right first move every time.
          - status
          # Apply everything pending, in order. This is the one that changes the
          # database.
          - deploy
          # ONE-TIME, for a database whose schema predates migrations: records
          # 0_init as already applied without running it. Production was built by
          # `db push` and hand-written SQL, so it has the tables but no history.
          # Running deploy first would try to CREATE TABLE over the live data and
          # fail.
          - baseline

jobs:
  migrate:
    name: ${{ inputs.action }} — production
    runs-on: ubuntu-latest
    # A dispatch is already deliberate; this makes the target unmistakable in the
    # run list, so nobody opens the wrong log to decide whether it worked.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: ${{ inputs.action }}
        env:
          # The session pooler on 5432 — IPv4, which a GitHub runner can reach.
          # db.<ref>.supabase.co is IPv6-only. Same secret the drift audit uses.
          DATABASE_URL: ${{ secrets.PROD_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "PROD_DIRECT_URL is not set — nothing to do."
            exit 1
          fi

          case "${{ inputs.action }}" in
            status)
              # ⚠️ A RED RUN HERE IS AN ANSWER, NOT A BREAKAGE. `migrate status`
              # exits 1 when production has migrations pending, which is the
              # thing worth being loud about — so the exit code is left alone
              # rather than swallowed into a green tick nobody reads. Read the
              # log: "Database schema is up to date!" is the all-clear, and a
              # list under "have not yet been applied" is the work to do.
              npx prisma migrate status
              ;;
            deploy)
              npx prisma migrate deploy
              echo
              echo "Applied. Now confirm the schema matches the repo:"
              npx prisma migrate status
              ;;
            baseline)
              # Idempotent enough to be safe to re-run: resolving an already
              # applied migration fails loudly rather than doing damage.
              npx prisma migrate resolve --applied 0_init
              npx prisma migrate status
              ;;
          esac
