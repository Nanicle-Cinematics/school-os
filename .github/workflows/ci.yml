name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily. Production schema changes are applied from prisma/migrations by the
    # `migrate` workflow, but that is still a thing a person remembers to run —
    # and before migrations existed, drift went unnoticed for ten days
    # (SchoolAsset). A timer bounds how long it can happen for.
    - cron: "0 6 * * *"
  # Run the production audit on demand: `gh workflow run CI`, or the Run workflow
  # button. Wanted the moment you deploy a schema change rather than waiting for
  # 06:00 UTC — and it is how this guard was first proved to work at all.
  workflow_dispatch:

# A newer push makes an in-flight run pointless; don't pay for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repository, so the token may only read it.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, seed and verify the engines
    runs-on: ubuntu-latest
    # The server-backed guards drive the app over HTTP; if one wedges, fail in
    # 20 minutes rather than sitting on a runner for GitHub's 6-hour default.
    timeout-minutes: 20

    # A throwaway Postgres, seeded from scratch each run. The engine suites read
    # real rows — money reconciliation, grading, debtor filtering — so they need
    # a database, but pointing CI at the Supabase project would have runs racing
    # each other through shared state and would put credentials in secrets for
    # no benefit. Started by .github/actions/postgres rather than as a service
    # container: a container image is pulled from a registry that rate-limits
    # per IP, on runners that share IPs, before any step can retry — see the
    # action for what that cost.

    steps:
      - uses: actions/checkout@v4

      - name: Postgres 17
        uses: ./.github/actions/postgres
        with:
          database: school_os

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # The verify scripts are run with `--env-file=.env`, so the file has to
      # exist. No pgbouncer here, so DIRECT_URL is the same connection and the
      # connection_limit=1 that production needs is deliberately absent.
      - name: Write .env
        run: |
          cat > .env <<'ENV'
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/school_os"
          DIRECT_URL="postgresql://postgres:postgres@localhost:5432/school_os"
          DB_RLS="off"
          # This database is a throwaway with one seeded school, so the suites
          # run unscoped on the owner connection. Saying so explicitly is what
          # the production guard in src/lib/prisma.ts requires — it refuses to
          # start a production build that has isolation switched off by accident
          # rather than on purpose.
          ALLOW_UNSCOPED_DB="1"
          APP_URL="http://localhost:3000"
          ENV

      - name: Generate Prisma client
        run: npm run db:generate

      # Built from the MIGRATIONS, not from `db push`. Every suite below then runs
      # against a database assembled the same way production is, so a migration
      # that does not apply — or applies to something subtly different from the
      # schema — fails here rather than in the Supabase SQL editor at 9pm.
      - name: Create the schema from migrations
        run: npm run db:deploy

      # ...and prove the result actually matches prisma/schema.prisma. Applying
      # cleanly is not the same as arriving at the right shape: a migration
      # edited by hand can succeed and still leave a column behind.
      - name: Do the migrations produce the schema they claim?
        run: |
          # --from-schema-datasource, not --from-url: shell steps here have no
          # DATABASE_URL exported — the job writes a .env that the Prisma CLI
          # loads itself, which is also how db:deploy above finds the database.
          set +e
          node_modules/.bin/prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --script --exit-code > /tmp/after.sql 2>/tmp/after.err
          code=$?
          set -e
          if [ "$code" = "0" ]; then
            echo "the migrated database matches prisma/schema.prisma"
            exit 0
          fi
          if [ "$code" = "2" ]; then
            echo "The migrations do not produce prisma/schema.prisma. Missing:"
            cat /tmp/after.sql
            exit 1
          fi
          cat /tmp/after.err; exit 1

      - name: Seed a demo school
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      # Row security stops a query that forgot its school. It cannot stop an
      # injected statement: the policy passes every row when app.bypass_rls is
      # 'on', and any code that can run a SQL string can set that for itself.
      # This keeps string-built SQL out of src/ (it needs no database).
      - name: Raw SQL — no string-built queries outside prisma.ts
        run: npm run verify:raw-sql

      - name: Money — payments, allocations and invoice balances
        run: npm run db:verify

      - name: Results — grading, weighting, ranking, aggregate
        run: npm run verify:results

      - name: Roll-up — a class roll-up writes only what changed, and the same rows a fresh one would
        run: npm run verify:rollup

      - name: Invoice batch — the batched invoice run writes the same rows as the one-at-a-time run, in a few statements
        run: npm run verify:invoice-batch

      - name: Scoped counts — the dashboard, assessments, fees and chart-of-accounts counts equal Prisma's, and their indexes exist
        run: npm run verify:scoped-counts

      - name: Staff removal — who cannot be removed is asked when Remove is pressed, not counted on every view
        run: npm run verify:staff-removal

      - name: Guardian removal — deleting a guardian takes them off the child, ends their login, and the clean-up migration repairs old strays
        run: npm run verify:guardian-removal

      - name: Held messages — a held SMS sends nothing until released, Cancel and release cannot both win, and the scheduled endpoint refuses a stranger
        run: npm run verify:message-hold

      - name: Home-screen label — the school's short name under its icon
        run: npm run verify:home-screen-label

      - name: Icon compose — padding never goes black
        run: npm run verify:icon-compose

      - name: Owner scripts ignore dev env
        run: npm run verify:owner-env
      - name: GES baseline — the ladder, nursery to JHS 3, and what adding to it does to an existing school
        run: npm run verify:ges-baseline

      - name: SMS — phone normalisation, GSM-7 segments, merge fields
        run: npm run verify:sms

      # A security flow, so every assertion is a refusal: a wrong code, a spent
      # one, an expired one, a sixth guess, a staff number, a stranger's number.
      # The two ways an account is created must store a phone number in the same
      # shape. They did not, for months: a staff member had to type theirs in the
      # exact format the office used, and got the wrong-password message when
      # they did not.
      - name: Logins — a phone number resolves however it is typed
        run: npm run verify:logins

      - name: Password reset — codes, expiry and guessing
        run: npm run verify:reset

      # The subscription is a switch that does something: an unpaid school reads
      # and prints but cannot write. Includes the re-scoping check — every action
      # re-sets the tenant context, and losing readOnly there would leave the
      # guard perfect and unreachable.
      - name: Subscriptions — read-only enforcement
        run: npm run verify:platform

      # Deleting a school is done by pasting generated SQL into the Supabase
      # editor, against a database this machine cannot reach — so the only
      # moment it could be checked by running it is the moment it is too late.
      # This builds the same situation here, runs the text the command itself
      # printed (captured from its stdout, never retyped), and looks at what
      # survived. The bystanders are the point: the connected version's first
      # draft swept every orphan in the database rather than this school's own,
      # and only a deliberate unrelated account caught it.
      #
      # Safe beside the seeded school: it creates and removes its own
      # `zzz-sql-*` fixtures and touches nothing else. It runs before the RLS
      # steps because the generated SQL is written for the OWNER connection,
      # which is who the Supabase editor is.
      - name: Deleting a school — the pasted SQL does what the command does
        run: npm run verify:platform:sql

      # Every switch in /settings does something. Four of them did not:
      # blockReportOnArrears promised to withhold report cards and withheld
      # nothing, and the two position toggles printed regardless. The field list
      # comes from the Prisma DMMF, so a setting added tomorrow is covered the
      # day it is added rather than the day somebody remembers to add it here.
      # The palette is one set of NAMES with four sets of values — light, dark,
      # .paper and print. A token re-cut for the dark and not put back by paper
      # is a dark stripe through a report card at night, and nothing errors.
      - name: Theme — every token dark re-cuts, paper and print put back
        run: npm run verify:theme

      # The redesign's rules, as something that fails rather than a memory: one
      # table wrapper, one primary button, sentence case, one icon set, and area
      # hues confined to the rail. Each exception is named in the script with
      # its reason, so a new one is a deliberate act somebody has to write down.
      - name: Design — one set of primitives, and colour that says one thing
        run: npm run verify:design

      # WCAG AA on every pair a screen actually renders, in both themes. A
      # palette can be coherent, tokenised, guarded against drift and still be
      # unreadable — "it looks fine on my screen" is not a measurement, and this
      # is read on a phone in a bright school office.
      - name: Contrast — every pair meets AA, light and dark
        run: npm run verify:contrast

      - name: Settings — no dead switches, and the arrears hold actually holds
        run: npm run verify:settings

      # Data goes out as well as in. Every way of getting a CSV wrong is quiet —
      # a comma in an address shifts every column after it, Excel eats the
      # leading zero off a phone number, and an empty file is what a forgotten
      # tenant context looks like under RLS. So each of those is a check, and the
      # register is fed back through the real importer to prove it round-trips.
      - name: Export — the file is not a trap, and the role is checked
        run: npm run verify:export

      # ⚠️ These four existed and ran NOWHERE. A guard nobody runs is not a
      # guard: `school.subscription.paid` and `data.export` both reached the
      # dashboard as raw strings ("data export · Activity · Grace Amoah") while
      # verify:activity sat in package.json with the answer in it. They cost
      # seconds; the reason they were not here is that nobody added them.
      - name: Duplicate pupils — what is suggested, and what a merge moves, refuses and leaves
        run: npm run verify:duplicates

      - name: Unplaced pupils — the attention item and the Students filter agree
        run: npm run verify:unplaced

      - name: Dashboard counts — deleted people are not counted
        run: npm run verify:dashboard-counts

      - name: Dashboard — the attention cards say what is actually wrong
        run: npm run verify:attention

      - name: Dashboard — collections arithmetic and the weekly chart
        run: npm run verify:collections

      - name: Activity feed — every audited action has a phrase
        run: npm run verify:activity

      - name: Search — what each role may find
        run: npm run verify:search

      - name: Audience — campaign reach, dedupe, debtor filtering
        run: npm run verify:audience

      - name: Invoicing — fee-structure matching and why a student was skipped
        run: npm run verify:invoicing

      - name: Arrears carried forward follow the old invoice, not a frozen snapshot
        run: npm run verify:carry-forward

      - name: Advance bill — arrears across a year boundary, and the level a child will be billed at
        run: npm run verify:proforma

      - name: Nursery skills — what a rating may be, who may enter one, and that it never touches the marks
        run: npm run verify:skills

      - name: Platform-admin two-factor — RFC 6238 vectors, replay, encryption at rest
        run: npm run verify:totp

      - name: Passwords — hashing, and a temporary password with too many possibilities to spray
        run: npm run verify:password

      - name: Session policy — how long each kind of session lasts, and that both readers agree
        run: npm run verify:session-policy

      - name: Score limits — a mark may not exceed its total, and who may record one
        run: npm run verify:score-limits

      - name: Public routes — what an unauthenticated route may spend, and that every one is inside it
        run: npm run verify:public-routes

      - name: Load-test guard — the load test refuses a target that is dev, production or unnamed
        run: npm run verify:load-guard

      - name: Heavy work — roll-ups and invoice runs are capped at two per instance, and nothing skips the cap
        run: npm run verify:heavy-work

      - name: Wide counts — no new whole-table relation count over a table that grows without bound
        run: npm run verify:wide-counts

      - name: Score writes — a mark-sheet save writes only the cells that changed, and loses none
        run: npm run verify:score-writes

      - name: Enrolment code — a platform admin cannot set up two-factor sign-in with the password alone
        run: npm run verify:enrolment-code

      # Ageing boundaries, the amount in words on a receipt, and the hold that
      # keeps unapproved spending out of the cash book. The approval check
      # WRITES a DRAFT expense and removes it — its first version asserted the
      # exclusion against a database with no drafts in it and passed with
      # "0.00 held", which is a check that cannot fail.
      - name: Finance — receipts, ageing and the approval hold
        run: npm run verify:finance

      # The posting engine's own invariant: every journal entry balances, and
      # postJournalEntry refuses one that would not.
      - name: Ledger — every journal entry balances
        run: npm run verify:ledger

      # A table with a schoolId has NO row security until `npm run db:rls` is
      # re-run, and nothing runs it for you. That is how AssessmentTemplate
      # (2026-08-28) and then SchoolAsset (2026-09-07) both reached production
      # unprotected — the second went unnoticed for ten days. Nothing failed:
      # the suites above run unscoped as the owner with DB_RLS=off, and the
      # production guard in src/lib/prisma.ts only checks that the isolation
      # env vars are SET, never that a policy exists. So a booting site and a
      # green CI run both proved nothing about coverage.
      #
      # These two steps close that. The database is the throwaway service
      # container, so no credentials are involved: apply the policies, then
      # assert coverage. verify:isolation's FIRST check is the coverage
      # assertion — every table with a schoolId carries RLS, FORCE and a policy
      # — so a PR adding a tenant table without one fails here, naming the
      # table, instead of shipping a cross-tenant read.
      #
      # These run last because the suites above deliberately exercise an
      # unprotected database; applying RLS earlier would change what they test.
      # Shell env overrides --env-file in Node, so DB_RLS=on wins over the
      # DB_RLS="off" written into .env above without needing a second file.
      - name: Apply row-level security
        run: npm run db:rls
        env:
          # Without this, apply-rls.mjs invents a random password for the role
          # and prints it, which no later step could use.
          APP_DB_PASSWORD: ci-app-role-not-a-real-secret

      - name: Tenant isolation — RLS coverage, cross-tenant reads and writes
        run: npm run verify:isolation
        env:
          DB_RLS: "on"
          APP_DATABASE_URL: "postgresql://school_os_app:ci-app-role-not-a-real-secret@localhost:5432/school_os"

      - name: Build
        run: npm run build

      # verify:teacher, verify:parent and verify:actions were left out of CI
      # because they "need a running dev server". They do not — they need HTTP,
      # and they already take VERIFY_BASE_URL. So CI starts the build it just
      # made and points them at it.
      #
      # This matters most for verify:parent. A parent seeing only their OWN
      # children is enforced in application code, not by Postgres: RLS scopes to
      # the school, and two families are the same tenant. So unlike every other
      # isolation property here, nothing in the database backstops a mistake —
      # leaving it to "someone remembers to run it" made the portal's whole
      # security model a manual check.
      #
      # Started with the RLS env so the server runs as production does, against
      # the restricted role with policies applied by the step above.
      - name: Start the built app
        env:
          # Not a real secret: a fixed key so the enrolment guard can read back the authenticator
          # secret the app makes. Production's lives in the deployment's environment.
          TOTP_ENCRYPTION_KEY: "Y2ktdG90cC1rZXktbm90LWEtcmVhbC1zZWNyZXQteHg="
          DB_RLS: "on"
          APP_DATABASE_URL: "postgresql://school_os_app:ci-app-role-not-a-real-secret@localhost:5432/school_os"
        run: |
          npm run start > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)" = "200" ]; then
              echo "app answering after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "the app never became ready:"; cat /tmp/server.log; exit 1

      - name: Role guards — a teacher, a parent and an IT admin see only their own screens
        env:
          DB_RLS: "on"
          APP_DATABASE_URL: "postgresql://school_os_app:ci-app-role-not-a-real-secret@localhost:5432/school_os"
          VERIFY_BASE_URL: "http://localhost:3000"
        run: |
          npm run verify:teacher
          npm run verify:parent
          npm run verify:it-admin

      # Attendance runs HERE, not with the offline engine checks, because half
      # of it drives the real `saveRegister` over HTTP — the term lookup, the
      # roster check and `mayMark` live behind `requireRole` and cannot be
      # reached any other way. Run without an app it skips that half loudly
      # rather than passing on the engine alone.
      #
      # It WRITES, unlike most of the suite: a register has to exist before its
      # arithmetic can be checked. It clears and rebuilds only its own class's
      # attendance, so re-running it is safe against the seeded database.
      - name: Attendance — the register, and what it puts on the report card
        env:
          DB_RLS: "on"
          APP_DATABASE_URL: "postgresql://school_os_app:ci-app-role-not-a-real-secret@localhost:5432/school_os"
          VERIFY_BASE_URL: "http://localhost:3000"
        run: npm run verify:attendance

      # Mock exams for the BECE year. Here, after the app starts, for the same
      # reason as attendance: the sheet's guards (assigned teacher, marks out of
      # 100, a closed mock is final) live behind requireRole in "use server"
      # functions. The engine half — the BECE aggregate — needs nothing. It
      # WRITES a mock in the seeded school and deletes it again.
      - name: Mock exams — the BECE aggregate, and who may enter marks
        env:
          DB_RLS: "on"
          APP_DATABASE_URL: "postgresql://school_os_app:ci-app-role-not-a-real-secret@localhost:5432/school_os"
          VERIFY_BASE_URL: "http://localhost:3000"
        run: npm run verify:mocks

      # A school provisioned minutes ago, walked screen by screen. This is the
      # check for onboarding dead ends — a screen that maps over an empty
      # collection and offers no way forward — which the demo seed hides, because
      # it creates everything. It PRINTED and asserted nothing until 2026-09-10,
      # and so reported 27 healthy-looking screens while every one of them was a
      # redirect to /account/password.
      # Headless Chrome, because this is the one failure the other guards cannot
      # see: they ask the DOM what exists, and the phone menu existed all along —
      # 276x63 behind the page, because a backdrop-filter ancestor was capturing
      # its `position: fixed`. Four of this script's own checks passed while it
      # was broken. Layout has to be measured, not queried.
      - name: Phone — the menu opens, and the page does not scroll sideways
        env:
          DB_RLS: "on"
          APP_DATABASE_URL: "postgresql://school_os_app:ci-app-role-not-a-real-secret@localhost:5432/school_os"
          VERIFY_BASE_URL: "http://localhost:3000"
        run: npm run verify:mobile-nav

      - name: Mark grids and promotions in a browser — a tick survives a save, and a refusal
        env:
          DB_RLS: "on"
          APP_DATABASE_URL: "postgresql://school_os_app:ci-app-role-not-a-real-secret@localhost:5432/school_os"
          VERIFY_BASE_URL: "http://localhost:3000"
        run: npm run verify:grid-browser

      - name: Onboarding — every screen a day-one school opens
        env:
          DB_RLS: "on"
          APP_DATABASE_URL: "postgresql://school_os_app:ci-app-role-not-a-real-secret@localhost:5432/school_os"
          VERIFY_BASE_URL: "http://localhost:3000"
        run: npm run verify:onboarding

      - name: Server-action guards — refusals and previews
        env:
          DB_RLS: "on"
          APP_DATABASE_URL: "postgresql://school_os_app:ci-app-role-not-a-real-secret@localhost:5432/school_os"
          VERIFY_BASE_URL: "http://localhost:3000"
        run: npm run verify:actions

      # `verify:export` above exercises the loaders and the CSV writer. It
      # cannot see the things that exist only on the route: the role refusal,
      # the tenant context, the headers that make a browser save a file, and
      # the audit row. Those are the parts that fail QUIETLY — a forgotten
      # `setTenantContext` returns a header with no rows, which reads to a
      # school as "we have no students", and a missing role check hands a
      # teacher the whole register with a 200.
      - name: Export over HTTP — the role, the headers and the audit row
        env:
          DB_RLS: "on"
          APP_DATABASE_URL: "postgresql://school_os_app:ci-app-role-not-a-real-secret@localhost:5432/school_os"
          VERIFY_BASE_URL: "http://localhost:3000"
        run: npm run verify:export:route

      - name: Sign-in upgrades a password hash to the current cost, through the real form
        env:
          DB_RLS: "on"
          APP_DATABASE_URL: "postgresql://school_os_app:ci-app-role-not-a-real-secret@localhost:5432/school_os"
          VERIFY_BASE_URL: "http://localhost:3000"
        run: npm run verify:login-upgrade

      - name: Session lifetime — idle and absolute limits, applied to a real request
        env:
          DB_RLS: "on"
          APP_DATABASE_URL: "postgresql://school_os_app:ci-app-role-not-a-real-secret@localhost:5432/school_os"
          VERIFY_BASE_URL: "http://localhost:3000"
        run: npm run verify:session-lifetime

      - name: Assessment entry — who records one, and no mark above its total, through the real forms
        env:
          DB_RLS: "on"
          APP_DATABASE_URL: "postgresql://school_os_app:ci-app-role-not-a-real-secret@localhost:5432/school_os"
          VERIFY_BASE_URL: "http://localhost:3000"
        run: npm run verify:assessment-entry

      - name: School icon — the public routes serve a crest, refuse junk cheaply, and survive a flood
        env:
          DB_RLS: "on"
          APP_DATABASE_URL: "postgresql://school_os_app:ci-app-role-not-a-real-secret@localhost:5432/school_os"
          VERIFY_BASE_URL: "http://localhost:3000"
        run: npm run verify:school-icon

      - name: Platform enrolment — a session with only the password cannot enrol, through the real forms
        env:
          TOTP_ENCRYPTION_KEY: "Y2ktdG90cC1rZXktbm90LWEtcmVhbC1zZWNyZXQteHg="
          DB_RLS: "on"
          APP_DATABASE_URL: "postgresql://school_os_app:ci-app-role-not-a-real-secret@localhost:5432/school_os"
          VERIFY_BASE_URL: "http://localhost:3000"
        run: npm run verify:platform-enrolment

      # if: always() so a failing guard still stops the app and shows its log —
      # a server left running would hang the job, and the log is usually where
      # the actual reason is.
      - name: Stop the app
        if: always()
        run: |
          kill "$(cat /tmp/server.pid)" 2>/dev/null || true
          echo "--- server log (tail) ---"
          tail -40 /tmp/server.log || true

  # The job above proves the RLS machinery works; it CANNOT prove production is
  # protected, because it runs `db:rls` on its own throwaway database, so a newly
  # added tenant table is always protected there. Verified by adding a canary
  # table on 2026-09-08: the run stayed green at 42 tables.
  #
  # The bug both incidents actually were is drift between the schema and
  # PRODUCTION — a `db push` by hand with no `db:rls` after it. Only production
  # can answer that, so this job asks it. Read-only: audit-rls.mjs runs no DDL,
  # deliberately, so a forgotten step is reported rather than silently repaired.
  prod-rls:
    name: Production checks — RLS coverage and schema drift
    runs-on: ubuntu-latest
    # Not on pull requests: secrets are unavailable to fork PRs, and a PR has
    # not deployed anything yet.
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Audit production RLS coverage
        env:
          # The OWNER connection (session pooler, 5432). Add under
          # Settings → Secrets and variables → Actions. Until it exists this
          # step skips rather than fails, so the check can be merged before the
          # credential is rotated and stored.
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "PROD_DIRECT_URL is not set — skipping the production audit."
            echo "Add it under Settings → Secrets and variables → Actions to enable this."
            exit 0
          fi
          npm run audit:rls

      # Does the live database still match the repo? main auto-deploys, so a
      # schema the code expects and does not have is a 500 on every page that
      # touches it. This check existed before migrations did, when production
      # was changed by pasting SQL into Supabase's editor and the only thing
      # between a forgotten ALTER and an outage was somebody remembering.
      #
      # It is still the backstop now that migrations exist, because it asks the
      # DATABASE rather than the migration history: a migration marked applied
      # that did not do what its filename claims still shows up here.
      #
      # ⚠️ EXPECTED TO BE RED for a few minutes after merging a DESTRUCTIVE
      # change. Those merge first and migrate after the deploy lands (see
      # CLAUDE.md), so main is briefly ahead of production by exactly one DROP.
      # Run the migration, then re-run this job. A drift that OUTLIVES that
      # window is the real thing.
      #
      # Verified against a real Supabase database that it does NOT report false
      # drift for RLS policies, the school_os_app role, or Supabase's own
      # objects; and that a deliberately added field makes it exit 2.
      - name: Schema drift — does production match prisma/schema.prisma?
        env:
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "PROD_DIRECT_URL is not set — skipping the drift check."
            exit 0
          fi
          set +e
          node_modules/.bin/prisma migrate diff \
            --from-url "$DIRECT_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script --exit-code > /tmp/drift.sql 2>/tmp/drift.err
          code=$?
          set -e
          if [ "$code" = "0" ]; then
            echo "production matches prisma/schema.prisma"
            exit 0
          fi
          if [ "$code" = "2" ]; then
            echo "DRIFT: production does not match prisma/schema.prisma."
            echo
            echo "Do NOT paste the SQL below into the Supabase editor — that is"
            echo "the old way, and it is how the same file got run twice against"
            echo "dev while production stayed untouched. Reconcile with:"
            echo "  gh workflow run migrate.yml -f action=status"
            echo "  gh workflow run migrate.yml -f action=deploy"
            echo
            echo "If a migration is pending, deploy it. If none is, the schema"
            echo "was changed by hand and needs a migration written for it."
            echo "The difference, for reading only:"
            echo "---"
            cat /tmp/drift.sql
            echo "---"
            exit 1
          fi
          echo "migrate diff failed (exit $code):"
          cat /tmp/drift.err
          exit 1
